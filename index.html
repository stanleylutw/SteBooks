<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="史丹利的免費電子書網站，收錄長期投資、風險管理與實戰筆記。">
<title>STeBooks｜史丹利電子書</title>
<style>
:root{
  --bg:#f6f8fb;
  --paper:#ffffff;
  --ink:#111827;
  --muted:#5f6b7a;
  --line:#dce3ec;
  --accent:#0b5fc6;
  --accent-soft:#e8f2ff;
  --green:#0f4d3e;
  --gold:#b78b3d;
  --max:980px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.75;
  font-size:18px;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;height:auto}
.site{
  max-width:var(--max);
  margin:0 auto;
  padding:32px 22px 64px;
}
.masthead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px;
  padding:10px 0 28px;
  color:var(--muted);
  font-size:14px;
}
.brand{
  color:var(--ink);
  font-weight:800;
  letter-spacing:.02em;
}
.intro{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(240px,340px);
  gap:32px;
  align-items:center;
  padding:34px 0 42px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.eyebrow{
  display:inline-block;
  color:var(--accent);
  font-size:14px;
  font-weight:800;
  letter-spacing:.08em;
  margin-bottom:10px;
}
h1{
  font-size:clamp(36px,7vw,62px);
  line-height:1.08;
  margin:.05em 0 .28em;
  letter-spacing:0;
}
.lead{
  color:#354154;
  font-size:21px;
  margin:0;
  max-width:650px;
}
.book-carousel{
  position:relative;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:8px;
  overflow:visible;
  box-shadow:0 18px 44px rgba(17,24,39,.12);
}
.book-carousel:before{
  content:"";
  position:absolute;
  inset:14px;
  border:1px solid rgba(11,95,198,.16);
  border-radius:50%;
  transform:rotate(-12deg);
  animation:orbit 16s linear infinite;
  pointer-events:none;
}
@keyframes orbit{
  to{transform:rotate(348deg)}
}
.carousel-track{
  position:relative;
  display:flex;
  transition:transform .36s ease;
}
.carousel-window{
  position:relative;
  overflow:hidden;
  border-radius:8px;
}
.book-slide{
  flex:0 0 100%;
  position:relative;
  display:block;
  color:var(--ink);
}
.book-slide img{
  width:100%;
  aspect-ratio:1055/1491;
  object-fit:cover;
}
.slide-info{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:18px 18px 30px;
  background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.96) 34%,#fff 100%);
}
.slide-info span{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:800;
  letter-spacing:.08em;
}
.slide-info strong{
  display:block;
  font-size:20px;
  line-height:1.35;
  margin-top:4px;
}
.carousel-control{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:38px;
  height:38px;
  border:1px solid var(--line);
  border-radius:50%;
  background:rgba(255,255,255,.92);
  color:var(--ink);
  font-size:24px;
  line-height:1;
  cursor:pointer;
  display:grid;
  place-items:center;
  box-shadow:0 8px 20px rgba(17,24,39,.1);
}
.carousel-control.prev{left:-19px}
.carousel-control.next{right:-19px}
.carousel-dots{
  position:absolute;
  left:0;
  right:0;
  bottom:10px;
  display:flex;
  justify-content:center;
  gap:8px;
}
.carousel-dot{
  width:8px;
  height:8px;
  border:0;
  border-radius:50%;
  background:#c7d2e0;
  padding:0;
  cursor:pointer;
}
.carousel-dot.active{
  width:22px;
  border-radius:999px;
  background:var(--accent);
}
.section-title{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
  margin:34px 0 16px;
}
h2{
  font-size:28px;
  line-height:1.25;
  margin:0;
}
.small{
  color:var(--muted);
  font-size:14px;
}
.chapters{
  display:grid;
  gap:12px;
}
.chapter{
  display:grid;
  grid-template-columns:72px minmax(0,1fr) auto;
  gap:16px;
  align-items:center;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:8px;
  padding:16px 18px;
}
.chapter:hover{
  border-color:#b9cce4;
  box-shadow:0 8px 24px rgba(17,24,39,.07);
}
.num{
  display:flex;
  align-items:center;
  justify-content:center;
  width:48px;
  height:48px;
  border-radius:50%;
  background:var(--accent-soft);
  color:var(--accent);
  font-weight:800;
}
.chapter strong{
  display:block;
  font-size:20px;
}
.chapter span{
  color:var(--muted);
  display:block;
  font-size:15px;
  line-height:1.55;
  margin-top:2px;
}
.arrow{
  color:var(--accent);
  font-weight:800;
}
.footer{
  color:var(--muted);
  font-size:14px;
  padding-top:36px;
}
@media (max-width:720px){
  body{font-size:17px;background:#fff}
  .site{padding:24px 18px 52px}
  .intro{grid-template-columns:1fr;padding-top:26px}
  .book-carousel{max-width:320px}
  .carousel-control{width:34px;height:34px;font-size:21px}
  .carousel-control.prev{left:-4px}
  .carousel-control.next{right:-4px}
  .slide-info{padding:16px 14px 24px}
  .slide-info strong{font-size:18px}
  .section-title{display:block}
  .chapter{grid-template-columns:56px minmax(0,1fr);padding:14px}
  .arrow{display:none}
}
</style>
<script data-goatcounter="https://elecy88.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<main class="site">
  <header class="masthead">
    <div class="brand">STeBooks</div>
    <div>作者｜史丹利</div>
  </header>

  <section class="intro">
    <div>
      <span class="eyebrow">FREE E-BOOKS</span>
      <h1>史丹利電子書</h1>
      <p class="lead">收錄投資實戰筆記、風險管理與長期策略，並用不同角度探索財務觀念。</p>
    </div>
    <div class="book-carousel" aria-label="電子書封面選書">
      <div class="carousel-window">
        <div class="carousel-track">
          <a class="book-slide" href="chapters/chapter-01/">
            <img src="chapters/chapter-01/assets/cover.png" alt="《撐得住，才賺得到》封面">
            <div class="slide-info">
              <span>BOOK 01</span>
              <strong>撐得住，才賺得到</strong>
            </div>
          </a>
          <a class="book-slide" href="chapters/chapter-02/">
            <img src="chapters/chapter-02/assets/cover_reference.png" alt="《房子不要只住，要讓它工作》封面">
            <div class="slide-info">
              <span>BOOK 02</span>
              <strong>房子不要只住，要讓它工作</strong>
            </div>
          </a>
        </div>
      </div>
      <button class="carousel-control prev" type="button" aria-label="上一本文">‹</button>
      <button class="carousel-control next" type="button" aria-label="下一本文">›</button>
      <div class="carousel-dots" aria-label="選擇書籍">
        <button class="carousel-dot active" type="button" aria-label="選擇第 1 本"></button>
        <button class="carousel-dot" type="button" aria-label="選擇第 2 本"></button>
      </div>
    </div>
  </section>

  <section aria-labelledby="books-title">
    <div class="section-title">
      <h2 id="books-title">目前書目</h2>
    </div>
    <div class="chapters">
      <a class="chapter" href="chapters/chapter-01/">
        <span class="num">01</span>
        <div>
          <strong>撐得住，才賺得到</strong>
          <span>從 600 萬到 1,180 萬淨價值：一年核心資產與股票質押實戰。</span>
        </div>
        <span class="arrow">閱讀</span>
      </a>
      <a class="chapter" href="chapters/chapter-02/">
        <span class="num">02</span>
        <div>
          <strong>房子不要只住，要讓它工作</strong>
          <span>用房屋增貸打造第二條資產成長曲線，寫給已經有房產的人。</span>
        </div>
        <span class="arrow">閱讀</span>
      </a>
    </div>
  </section>

  <footer class="footer">© 2026 史丹利｜免費電子書網站</footer>
</main>
<script>
(function(){
  const carousel=document.querySelector('.book-carousel');
  const track=document.querySelector('.carousel-track');
  const slides=Array.from(document.querySelectorAll('.book-slide'));
  const dots=Array.from(document.querySelectorAll('.carousel-dot'));
  const prev=document.querySelector('.carousel-control.prev');
  const next=document.querySelector('.carousel-control.next');
  let current=0;
  let timer;

  function show(index){
    current=(index+slides.length)%slides.length;
    track.style.transform=`translateX(${-current*100}%)`;
    dots.forEach((dot,i)=>dot.classList.toggle('active',i===current));
  }

  function restart(){
    clearInterval(timer);
    timer=setInterval(()=>show(current+1),5000);
  }

  prev.addEventListener('click',()=>{show(current-1);restart();});
  next.addEventListener('click',()=>{show(current+1);restart();});
  dots.forEach((dot,i)=>dot.addEventListener('click',()=>{show(i);restart();}));
  carousel.addEventListener('mouseenter',()=>clearInterval(timer));
  carousel.addEventListener('mouseleave',restart);
  restart();
})();
</script>
</body>
</html>
