<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="史丹利的免費電子書網站，收錄長期投資、風險管理與實戰筆記。">
<title>STeBooks｜史丹利電子書</title>
<style>
:root{
  --bg:#f6f8fb;
  --paper:#ffffff;
  --ink:#111827;
  --muted:#5f6b7a;
  --line:#dce3ec;
  --accent:#0b5fc6;
  --accent-soft:#e8f2ff;
  --max:980px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.75;
  font-size:18px;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;height:auto}
.site{
  max-width:var(--max);
  margin:0 auto;
  padding:32px 22px 64px;
}
.masthead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px;
  padding:10px 0 28px;
  color:var(--muted);
  font-size:14px;
}
.brand{
  color:var(--ink);
  font-weight:800;
  letter-spacing:.02em;
}
.intro{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(240px,340px);
  gap:32px;
  align-items:center;
  padding:34px 0 42px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.eyebrow{
  display:inline-block;
  color:var(--accent);
  font-size:14px;
  font-weight:800;
  letter-spacing:.08em;
  margin-bottom:10px;
}
h1{
  font-size:clamp(36px,7vw,62px);
  line-height:1.08;
  margin:.05em 0 .28em;
  letter-spacing:0;
}
.lead{
  color:#354154;
  font-size:21px;
  margin:0;
  max-width:650px;
}
.cover{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 18px 44px rgba(17,24,39,.12);
}
.section-title{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
  margin:34px 0 16px;
}
h2{
  font-size:28px;
  line-height:1.25;
  margin:0;
}
.small{
  color:var(--muted);
  font-size:14px;
}
.chapters{
  display:grid;
  gap:12px;
}
.chapter{
  display:grid;
  grid-template-columns:72px minmax(0,1fr) auto;
  gap:16px;
  align-items:center;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:8px;
  padding:16px 18px;
}
.chapter:hover{
  border-color:#b9cce4;
  box-shadow:0 8px 24px rgba(17,24,39,.07);
}
.num{
  display:flex;
  align-items:center;
  justify-content:center;
  width:48px;
  height:48px;
  border-radius:50%;
  background:var(--accent-soft);
  color:var(--accent);
  font-weight:800;
}
.chapter strong{
  display:block;
  font-size:20px;
}
.chapter span{
  color:var(--muted);
  display:block;
  font-size:15px;
  line-height:1.55;
  margin-top:2px;
}
.arrow{
  color:var(--accent);
  font-weight:800;
}
.footer{
  color:var(--muted);
  font-size:14px;
  padding-top:36px;
}
@media (max-width:720px){
  body{font-size:17px;background:#fff}
  .site{padding:24px 18px 52px}
  .intro{grid-template-columns:1fr;padding-top:26px}
  .cover{max-width:280px}
  .section-title{display:block}
  .chapter{grid-template-columns:56px minmax(0,1fr);padding:14px}
  .arrow{display:none}
}
</style>
<script data-goatcounter="https://elecy88.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<main class="site">
  <header class="masthead">
    <div class="brand">STeBooks</div>
    <div>作者｜史丹利</div>
  </header>

  <section class="intro">
    <div>
      <span class="eyebrow">FREE E-BOOKS</span>
      <h1>史丹利電子書</h1>
      <p class="lead">收錄投資實戰筆記、風險管理與長期策略。每一本書會獨立成章節資料夾，方便之後持續新增與維護。</p>
    </div>
    <a class="cover" href="chapters/chapter-01/" aria-label="閱讀撐得住，才賺得到">
      <img src="chapters/chapter-01/assets/cover.png" alt="《撐得住，才賺得到》封面">
    </a>
  </section>

  <section aria-labelledby="books-title">
    <div class="section-title">
      <h2 id="books-title">目前書目</h2>
      <div class="small">每本電子書皆保留獨立章節資料夾，方便持續新增與維護。</div>
    </div>
    <div class="chapters">
      <a class="chapter" href="chapters/chapter-01/">
        <span class="num">01</span>
        <div>
          <strong>撐得住，才賺得到</strong>
          <span>從 600 萬到 1,180 萬淨價值：一年核心資產與股票質押實戰。</span>
        </div>
        <span class="arrow">閱讀</span>
      </a>
      <a class="chapter" href="chapters/chapter-02/">
        <span class="num">02</span>
        <div>
          <strong>房子不要只住，要讓它工作</strong>
          <span>用房屋增貸打造第二條資產成長曲線，寫給已經有房產的人。</span>
        </div>
        <span class="arrow">閱讀</span>
      </a>
    </div>
  </section>

  <footer class="footer">© 2026 史丹利｜免費電子書網站</footer>
</main>
</body>
</html>
